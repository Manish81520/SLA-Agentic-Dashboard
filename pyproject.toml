[project]
name = "onboarding-sla-dashboard"
version = "0.1.0"
description = "Generic onboarding SLA configuration analysis"
requires-python = ">=3.11"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.141.1",
    "google-adk==2.9.1",
    "google-genai==2.24.0",
    "openpyxl==3.1.5",
    "pandas==3.0.6",
    "pydantic==2.13.5",
    "python-dotenv==1.2.3",
    "python-multipart==0.0.22",
    "sqlalchemy==2.1.4",
    "uvicorn==0.53.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
