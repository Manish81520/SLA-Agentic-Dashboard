[project]
name = "onboarding-sla-dashboard"
version = "0.1.0"
description = "Generic onboarding SLA configuration analysis"
requires-python = ">=3.11"
dependencies = [
    "google-adk==2.9.1",
    "google-genai==2.24.0",
    "openpyxl==3.1.5",
    "pandas==3.0.6",
    "pydantic==2.13.5",
    "python-dotenv==1.2.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
